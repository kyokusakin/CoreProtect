plugins {
    id 'fabric-loom' version '1.14.6'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        url = 'https://maven.enginehub.org/repo/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    include(modImplementation("me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"))
    modCompileOnly "com.sk89q.worldedit:worldedit-fabric-mc1.21.11:${project.worldedit_version}"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "net.luckperms:api:${project.luckperms_api_version}"

    implementation "com.mysql:mysql-connector-j:8.4.0"
    implementation "org.xerial:sqlite-jdbc:3.51.2.0"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
