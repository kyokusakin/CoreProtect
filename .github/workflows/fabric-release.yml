name: Fabric Build & Release

on:
  push:
    branches:
      - Farbic
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabric-release
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Read mod version
        id: meta
        run: echo "version=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r')" >> "$GITHUB_OUTPUT"

      - name: Collect release jar
        run: |
          mkdir -p release
          cp build/libs/*.jar release/ 2>/dev/null || true
          rm -f release/*-sources.jar release/*-dev.jar release/*-dev-shadow.jar release/*-shadow.jar
          echo "Release artifacts:"
          ls -la release/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreprotect-fabric
          path: release/*.jar
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fabric-v${{ steps.meta.outputs.version }}
          name: CoreProtect Fabric v${{ steps.meta.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: release/*.jar
          fail_on_unmatched_files: true
